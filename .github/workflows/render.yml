name: Render profile signal

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  group: profile-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render live signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_profile.py

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: YoungJurry
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2358a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated assets
        run: |
          cp -R dist /tmp/profile-dist
          git checkout --orphan output
          git rm -rf .
          cp -R /tmp/profile-dist/. .
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile signal"
          git push --force origin output
